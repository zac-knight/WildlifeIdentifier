[project]
name = "wildlens-ml"
version = "0.1.0"
description = "Data pipeline, training, evaluation and export for WildLens"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "imagehash>=4.3",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.4",
  "pyarrow>=17",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "tenacity>=9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy dependencies are optional so that CI can test the data logic quickly.
train = [
  "lightgbm>=4.5",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.1",
  "soundfile>=0.12",
  "timm>=1.0",
  "torch>=2.5",
  "torchaudio>=2.5",
  "torchvision>=0.20",
]
climate = [
  "h5netcdf>=1.3",
  "h5py>=3.11",
  "rasterio>=1.5.2",
  "scipy>=1.14",
  "xarray>=2024.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildlens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# This file is mostly a Markdown template, whose table rows cannot be wrapped.
"data/make_dataset_card.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["train: needs the optional training dependencies"]
